[tool.poetry]
name = "log-parser-engine"
version = "0.1.0"
description = "A plugin-oriented log parser engine foundation"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "log_parser_engine", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9.2"
pyyaml = "^6.0.2"
defusedxml = "^0.7.1"
charset-normalizer = "^3.4.9"
fastapi = "^0.115.6"
uvicorn = { version = "^0.32.1", extras = ["standard"], optional = true }
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
